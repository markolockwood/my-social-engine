server {
    listen 80;
    server_name mytwit.com localhost;

    root /www/wwwroot/mytwit.com;
    index index.html index.php;

    charset utf-8;

    # Увеличиваем лимит на загрузку файлов
    client_max_body_size 50m;

    # Логи
    access_log /www/wwwlogs/mytwit.com.access.log;
    error_log /www/wwwlogs/mytwit.com.error.log;

    # Заголовки безопасности
    include /www/wwwroot/mytwit.com/nginx/snippets/security_headers.conf;

    # API запросы — обрабатываем через PHP
    location ^~ /api/ {
        location ~ \.php$ {
            fastcgi_pass unix:/tmp/php-cgi-81.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # Передаём custom заголовки в PHP
            fastcgi_param HTTP_X_TRACKING_ID $http_x_tracking_id;
            fastcgi_param HTTP_X_UPLOAD_CONTEXT $http_x_upload_context;

            # Без кэширования для API
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # Загруженные файлы — раздаём напрямую
    location ^~ /uploads/ {
        alias /www/wwwroot/mytwit.com/uploads/;

        # HLS манифесты
        location ~* \.m3u8$ {
            add_header Content-Type "application/vnd.apple.mpegurl";
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";
        }

        # HLS сегменты
        location ~* \.ts$ {
            add_header Content-Type "video/mp2t";
            add_header Cache-Control "public, max-age=31536000";
            add_header Access-Control-Allow-Origin "*";
        }

        # Изображения и видео
        location ~* \.(jpg|jpeg|png|gif|webp|mp4|webm)$ {
            add_header Cache-Control "public, max-age=31536000";
            add_header Access-Control-Allow-Origin "*";
        }
    }

    # Статические ассеты и dist/ (React build)
    location ^~ /dist/ {
        alias /www/wwwroot/mytwit.com/dist/;

        # Явно устанавливаем MIME-типы
        types {
            application/javascript js mjs;
            text/css css;
            text/html html;
        }

        default_type application/javascript;

        # Кэширование для JS и CSS
        location ~* \.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # Без кэширования для HTML
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Разрешить доступ к adminer.php (панель управления PostgreSQL)
    location = /adminer.php {
        fastcgi_pass unix:/tmp/php-cgi-81.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Запретить доступ к служебным файлам
    location ~ ^/(cleanup_temp_uploads\.php|composer\.json|package\.json|\.env|\.git|\.gitignore|\.htaccess|nginx\.conf) {
        deny all;
        return 404;
    }

    # Запретить доступ к скрытым файлам
    location ~ /\. {
        deny all;
        return 404;
    }

    # Корневой путь и все SPA маршруты — отдаём dist/index.html
    location / {
        # Для корневого пути сразу отдаем dist/index.html
        index /dist/index.html;
        try_files /dist$uri /dist$uri/ /dist/index.html;

        # Без кэширования для HTML
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
