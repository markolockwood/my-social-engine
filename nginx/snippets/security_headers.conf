add_header Content-Security-Policy  "default-src 'self'; img-src 'self' data: https: blob:; media-src 'self' blob:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' blob:; worker-src blob:;" always;
add_header X-Content-Type-Options  "nosniff"                            always;
add_header X-Frame-Options         "DENY"                               always;
add_header X-XSS-Protection        "1; mode=block"                      always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"    always;
